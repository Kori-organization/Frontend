<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kori – Informações</title>
    <link rel="stylesheet" href="CSS/information.css">
    <link rel="icon" href="../Assets/logo-top.svg" type="image/png">
</head>

<body>
    <!-- Main app container -->
    <div class="app">
        <!-- Sidebar navigation -->
        <aside class="sidebar">
            <div class="sidebar-menu">
                <div class="menu-item active2 one" onclick="window.location='index.html'">
                    <img src="../Assets/home-3.svg">
                    <h2>Início</h2>
                </div>
                <div class="menu-item active2 two" onclick="window.location='bulletin.html'">
                    <img src="../Assets/greeting.svg">
                    <h2>Boletim</h2>
                </div>
                <div class="menu-item active2 three" onclick="window.location='observation.html'">
                    <img src="../Assets/notes.svg">
                    <h2>Observações</h2>
                </div>
                <div class="menu-item active" onclick="location.reload()">
                    <img src="../Assets/info-circle-2.svg">
                    <h2>Informações</h2>
                </div>
            </div>
            <!-- User profile section -->
            <div class="profile" onclick="window.location='profile.html'">
                <img src="../Assets/user.svg" width="38">
            </div>
        </aside>

        <!-- Main content area -->
        <main class="main">
            <section class="hero">
                <div class="container">
                    <div class="left">
                        <img src="/Assets/text-information.svg" class="title-img">
                        <button class="btn" onclick="window.location='index.html'">
                            Ir para ínicio
                        </button>
                    </div>
                    <div class="right">
                        <img src="/Assets/children.png" class="child">

                        <div class="card card1">
                            Nossa prioridade é a educação infantil de qualidade.
                        </div>

                        <div class="card card2">
                            Empatia e respeito com o futuro do país
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
